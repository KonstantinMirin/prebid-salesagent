# Identity resolution and implementation selection. Same rule as the _impl bans above, one
# layer up: invoke_tool is the only door, and what it does behind that door is private.
#
# Four transports used to resolve their own identity and read ToolSpec.auth themselves. They
# disagreed twice -- A2A refusing a credential on a public task that MCP and REST served, and
# REST's discovery dependency hardcoding require_valid_token=False so a rejected credential
# was answered 200 there and 401 everywhere else. Neither was caught by a test; both were
# found by driving the wire.
#
# The primary defence is that there is nothing to call: invoke_tool takes an AuthContext and
# no identity, so a transport has nowhere to put one it resolved. These bans are the backstop
# for the NAMES, so the property survives someone reaching for them again.
"src.core.resolved_identity._resolve_identity".msg = "Identity is resolved once, in src/core/tools/_boundary.invoke_tool. A transport hands over an AuthContext; it does not resolve (salesagent-02rgd)."
"src.core.tools._boundary._resolve_identity".msg = "Identity is resolved once, in invoke_tool. Do not re-export or re-import the resolver (salesagent-02rgd)."
"src.core.tools._boundary._invoke_stamped".msg = "invoke_tool is the only door: it reads the registry row for both the implementation and the auth declaration. _invoke_stamped takes an already-chosen impl and an already-resolved identity -- which is how a transport used to select both (salesagent-02rgd)."
