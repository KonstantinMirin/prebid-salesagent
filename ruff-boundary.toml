# Tool-implementation import bans for the shipped tree (salesagent-83pmq).
#
# Run as its own quality line: `uv run ruff check --config ruff-boundary.toml
# --no-respect-gitignore src/ scripts/` (see Makefile `quality` / `quality-ci`).
#
# ## What this bans, and why the ban is the fix
#
# `src/core/tools/_boundary.py`'s `invoke()` is where a tool's obligations happen --
# account enrichment, idempotency scoping, replay lookup, success caching, version
# stamping. Its docstring states the invariant: an implementation is called with the
# request and the caller, and nothing else. A service that imports an `_impl` and calls
# it gives a tool a SECOND entry point, so the invariant holds for one of them and every
# obligation added to `invoke()` from then on silently does not apply to the other.
#
# The cure is making the call unavailable, not listing offenders --
# `docs/design/one-tool-registry.md` § "Why this needs no guards", and the precedent of
# `_register_tool`, which REFUSES a tool with no DTO rather than reporting one. Python
# cannot make a module-level function unimportable (`registry.py` must import all
# fourteen to build `TOOLS`), so the ban fires on the IMPORT: a service reaching for an
# impl fails the build where it reaches, not at review.
#
# ## Scope
#
# `src/` and `scripts/` -- the code this repo ships and operates with, matching
# `ruff-egress.toml`. `tests/` is deliberately out, and this is why the bans live in
# their own config rather than in `pyproject.toml`'s repo-wide table: a direct
# `_impl` call is SANCTIONED in tests (`tests/CLAUDE.md`: the harness's
# `env.call_impl(...)`, and `pytest.raises` against the error class, are the oracle
# where the obligation is about what `_impl` returns or raises). `tests/unit/
# test_architecture_bdd_no_direct_call_impl.py` governs the one place it is not.
#
# Unlike the egress line, this one runs WITHOUT `--ignore-noqa`: an import that cannot
# be cleaned takes a line-scoped `# noqa: TID251` with a reason beside it. There are
# none today, and a new one is a review conversation.
#
# ## Reaching an implementation legitimately
#
# `invoke_tool(name, req, identity)` from a transport; `TOOLS[name].impl` when you need
# the function object. A caller with no buyer and no request envelope wants a SERVICE,
# not the tool -- `delivery_for_media_buy` is the worked example.

[lint]
select = ["TID251"]

[lint.per-file-ignores]
# The registry must import all fourteen to build TOOLS. It is the ONLY exemption:
# every other importer is the disease this table exists to prevent.
"src/core/tools/registry.py" = ["TID251"]
# The boundary owns the resolver and the stamped entry; the resolver's module defines it.
"src/core/tools/_boundary.py" = ["TID251"]
"src/core/resolved_identity.py" = ["TID251"]

