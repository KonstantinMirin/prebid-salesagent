# Src-scoped egress import bans (GH #1589).
#
# Run as its own quality line: `uv run ruff check --config ruff-egress.toml src/`
# (see Makefile `quality` / `quality-ci`). Scope is src/ ONLY — tests import
# httpx/requests freely (TestClient, annotations, local origins); the seam
# architecture governs production egress, not test tooling.
#
# This table replaces the deleted AST scans #1 (raw network libs) and #2
# (SDK/MCP client constructors) of tests/unit/test_architecture_no_raw_egress.py.
# Non-vacuity is proven executable by tests/unit/test_ruff_egress_bans.py: every
# entry must fire on every resolving import spelling, every `# noqa: TID251`
# exemption must cover a live violation when stripped, and the exempt set is
# closed to the recorded constant there.
#
# Symbol bans enumerate EVERY resolving import path (banned-api matches the
# written path textually — a single-path ban is bypassable via re-exports).

[lint]
select = ["TID251", "ANN401"]

# ANN401 (`Any` in a signature) is scoped to the outbound chain, not all of src/.
#
# `Any` is not a type, it is an opt-out of type checking: assignable to and from
# everything by definition. So it is the one value the seam's own signatures
# CANNOT make unrepresentable. `send`/`asend` declare `json: JsonValue | None`,
# but a NEW forwarder declaring `json: Any` and passing it straight through
# type-checks clean, and mypy reports Success while a `datetime` reaches the
# wire (GH #1802 / salesagent-pldmk.37). That is the same defect pldmk.23 just
# removed from `VendorHttpClient.call` -- eliminated at every existing site,
# while remaining writable at the next one.
#
# The negated glob is what makes this a class-level ban rather than a list of
# known files: a forwarder added to a NEW module under either directory is
# covered on the day it is written. src/ as a whole is 209 violations and not
# this backstop's business; these two directories are 25.
[lint.per-file-ignores]
"!{src/core/security,src/adapters}/**" = ["ANN401"]

[lint.flake8-tidy-imports.banned-api]
# --- Module bans: the bare import fires, so verb/class enumeration is moot ---
"httpx".msg = "Outbound HTTP goes through src/core/security/outbound_http.py (send/asend) — the seam owns address, TLS, redirect and retry policy (GH #1589)."
"requests".msg = "Outbound HTTP goes through src/core/security/outbound_http.py (send/asend) — the seam owns address, TLS, redirect and retry policy (GH #1589)."
"aiohttp".msg = "aiohttp is a dropped dependency; outbound HTTP goes through src/core/security/outbound_http.py (GH #1589)."
"urllib.request".msg = "Outbound HTTP goes through src/core/security/outbound_http.py (send/asend), never urlopen (GH #1589)."

# --- MCP transports: construct via the MCP seam (src/core/utils/mcp_client.py),
# which validates the URL once and pins it with guarded_client_factory ---
"fastmcp.client.transports.StreamableHttpTransport".msg = "Construct via src.core.utils.mcp_client.create_mcp_client — the MCP seam pins the validated URL with src.core.security.outbound_http.guarded_client_factory (GH #1589)."
"fastmcp.client.StreamableHttpTransport".msg = "Construct via src.core.utils.mcp_client.create_mcp_client — the MCP seam pins the validated URL with src.core.security.outbound_http.guarded_client_factory (GH #1589)."
"fastmcp.client.transports.http.StreamableHttpTransport".msg = "Construct via src.core.utils.mcp_client.create_mcp_client — the MCP seam pins the validated URL with src.core.security.outbound_http.guarded_client_factory (GH #1589)."
"fastmcp.client.transports.SSETransport".msg = "Construct via src.core.utils.mcp_client.create_mcp_client — the MCP seam pins the validated URL with src.core.security.outbound_http.guarded_client_factory (GH #1589)."
"fastmcp.client.SSETransport".msg = "Construct via src.core.utils.mcp_client.create_mcp_client — the MCP seam pins the validated URL with src.core.security.outbound_http.guarded_client_factory (GH #1589)."
"fastmcp.client.transports.sse.SSETransport".msg = "Construct via src.core.utils.mcp_client.create_mcp_client — the MCP seam pins the validated URL with src.core.security.outbound_http.guarded_client_factory (GH #1589)."

# --- adcp SDK clients: constructing one dials, on an un-pinned path (adcp 6.6.0
# exposes no transport injection point — tracked by GH #1589) ---
"adcp.ADCPClient".msg = "Constructing an adcp client dials un-pinned (no transport injection point in adcp 6.6.0). Sanctioned sites carry a line-scoped noqa; see tests/unit/test_ruff_egress_bans.py (GH #1589)."
"adcp.client.ADCPClient".msg = "Constructing an adcp client dials un-pinned (no transport injection point in adcp 6.6.0). Sanctioned sites carry a line-scoped noqa; see tests/unit/test_ruff_egress_bans.py (GH #1589)."
"adcp.ADCPMultiAgentClient".msg = "Constructing an adcp client dials un-pinned (no transport injection point in adcp 6.6.0). Sanctioned sites carry a line-scoped noqa; see tests/unit/test_ruff_egress_bans.py (GH #1589)."
"adcp.client.ADCPMultiAgentClient".msg = "Constructing an adcp client dials un-pinned (no transport injection point in adcp 6.6.0). Sanctioned sites carry a line-scoped noqa; see tests/unit/test_ruff_egress_bans.py (GH #1589)."

# --- adcp SDK signer footgun: discards the body bytes it signs, so its own
# docstring's recommended usage reintroduces the signed-bytes-vs-wire-bytes
# divergence bug (GH #1802 / salesagent-47n9.1) ---
"adcp.webhooks.get_adcp_signed_headers_for_webhook".msg = "Discards the signed body bytes -- its own docstring example re-sends json=payload separately, reintroducing the signed-bytes-vs-wire-bytes divergence bug (GH #1802). Sign and send via src/core/security/outbound_http.py's send/asend with the signed byte string, not this helper."
"adcp.get_adcp_signed_headers_for_webhook".msg = "Discards the signed body bytes -- its own docstring example re-sends json=payload separately, reintroducing the signed-bytes-vs-wire-bytes divergence bug (GH #1802). Sign and send via src/core/security/outbound_http.py's send/asend with the signed byte string, not this helper."

# --- Address classification: owned by adcp.signing + the egress package's
# own supplement/blocklist (src/core/security/egress/policy.py). Reinventing
# either outside that one file is the disease #1589's own triage (F1) found:
# a second range set added five CIDRs with no check going red. ---
"ipaddress".msg = "Address classification belongs to adcp.signing + src/core/security/egress/policy.py's supplement/blocklist (GH #1589, adcontextprotocol/adcp-client-python#974). A second copy outside the egress package is the exact disease this backstop exists to prevent."
"socket.gethostbyname".msg = "Resolve-then-check is a TOCTOU the egress package does not use (adcp.signing pins the resolved IP in one step). Address classification belongs to src/core/security/egress/policy.py (GH #1589)."
