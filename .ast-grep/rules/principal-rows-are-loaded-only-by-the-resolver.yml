# A Principal row is loaded by the resolver alone.
#
# An implementation gets its principal from ``require_principal(identity)`` and nothing
# else: the resolver (``src/core/resolved_identity._resolve_identity``, through its
# primitives in ``src/core/auth_utils.py``) selects the row once, and the identity carries
# it. A second ``select(Principal)`` downstream is a second resolution -- it re-reads what
# the resolver decided and can disagree with it -- so it is unconstructible here rather
# than allowlisted. ``_create_media_buy_impl`` used to carry two, under FIXME(#1119), to
# read a ``.name`` the identity already held.
#
# WHY AST-GREP AND NOT A GUARD TEST. The raw-select guard
# (tests/unit/test_architecture_no_raw_select.py) keys its allowlist by FUNCTION, so a
# principal select inside a function that also owns an allowlisted product select is
# invisible to it. This rule keys on the MODEL: which class is being queried is a
# structural fact of the call, and ast-grep matches it whatever the function around it.
#
# The two owners are excluded by path, never by a suppression comment. The admin UI is
# not a third: it manages principals as rows and reaches them through
# ``src/core/database/repositories/principal.PrincipalRepository``.
id: principal-rows-are-loaded-only-by-the-resolver
language: Python
severity: error
message: >-
  A Principal row is loaded by the resolver alone. A tool reads its principal off
  require_principal(identity); an admin view goes through PrincipalRepository
  (src/core/database/repositories/principal.py). Do not select the Principal model here.
files:
  - "src/**/*.py"
ignores:
  - "src/core/auth_utils.py"
  - "src/core/database/repositories/**"
rule:
  any:
    - pattern: select(Principal)
    - pattern: select(ModelPrincipal)
    - pattern: select($MOD.Principal)
    - pattern: $SESSION.query(Principal)
    - pattern: $SESSION.query(ModelPrincipal)
    - pattern: $SESSION.query($MOD.Principal)
    - pattern: $SESSION.get(Principal, $$$ARGS)
    - pattern: $SESSION.get(ModelPrincipal, $$$ARGS)
    - pattern: $SESSION.get($MOD.Principal, $$$ARGS)
